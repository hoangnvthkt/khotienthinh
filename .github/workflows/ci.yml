name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Audit 20/10/2026 mục S6: chặn thư viện runtime có lỗ hổng high/critical (moderate còn lại: react-router SSR, không dùng).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:supabase-migrations
      - run: npm run lint
      - run: npm run check:supabase-queries
      - run: npm test
      - run: npm run build
