body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}

table{width:100%;border-collapse:collapse;font-size:12.5px}

/* ───────────────── Sankey 3 cột ───────────────── */
function buildSankey(){
  const col1 = {}, col2 = {};
  FLOWS.forEach(([a,b,n])=>{col1[a]=(col1[a]||0)+n;col2[b]=(col2[b]||0)+n});
  const c1 = Object.entries(col1).sort((a,b)=>b[1]-a[1]).map(([id,v])=>({id,v,col:0}));
  const c2 = Object.entries(col2).sort((a,b)=>b[1]-a[1]).map(([id,v])=>({id,v,col:1}));
  const c3 = OUTCOMES.map(o=>({id:o.id,v:o.n,col:2,o}));
  /* Cột 2 → cột 3: tổng kết quả là số thật; chia theo từng phòng theo tỷ lệ (minh họa) — "Đang chờ" chia theo số đang chờ thật của phòng */
  const sum2 = c2.reduce((a,n)=>a+n.v,0), sum3 = c3.reduce((a,n)=>a+n.v,0);
  const pendTot = Object.values(WAITING).reduce((a,b)=>a+b[0],0);
  const links2 = [];
  c2.forEach(u=>{
    const pendV = Math.min(u.v, (WAITING[u.id]?WAITING[u.id][0]:0) * (OUTCOMES[1].n/pendTot));
    const rest = u.v - pendV;
    const restTot = sum3 - OUTCOMES[1].n;
    OUTCOMES.forEach(o=>{
      const v = o.id==='PENDING'?pendV: rest*(o.n/restTot);
      if(v>0.05) links2.push({s:u.id,t:o.id,v,o});
    });
  });
  return {c1,c2,c3,links1:FLOWS.map(([a,b,v])=>({s:a,t:b,v})),links2};
}
function sankeySVG(){
  const {c1,c2,c3,links1,links2} = buildSankey();
  const W=880,H=570,NW=14,PAD=10,TOP=26;
  const cols=[c1,c2,c3];
  const scale = Math.min(...cols.map(c=>(H-TOP-PAD*(c.length-1)-10)/c.reduce((a,n)=>a+n.v,0)));
  const X=[8, (W-NW)/2, W-NW-8];
  const pos={};
  cols.forEach((c,ci)=>{let y=TOP;c.forEach(n=>{const hh=Math.max(3,n.v*scale);pos[ci+':'+n.id]={x:X[ci],y,h:hh,n};y+=hh+PAD})});
  /* nhãn: nút thấp dùng 1 dòng, đẩy xuống nếu chồng nhãn trước */
  cols.forEach((c,ci)=>{let last=-99;c.forEach(n=>{const p=pos[ci+':'+n.id];p.small=p.h<28;let ly=p.small?p.y+p.h/2+4:p.y+p.h/2+1;ly=Math.max(ly,last+(p.small?15:30));p.ly=ly;last=ly;})});
  /* offsets */
  const outOff={}, inOff={};
  const linkPaths=[];
  function addLinks(links, sc, tc, colorFn, cls){
    const bySource={};links.forEach(l=>{(bySource[l.s]=bySource[l.s]||[]).push(l)});
    /* sắp theo vị trí đích để giảm cắt nhau */
    const tIndex=id=>cols[tc].findIndex(n=>n.id===id);
    links.slice().sort((a,b)=>{const pa=pos[sc+':'+a.s].y-pos[sc+':'+b.s].y;return pa||(tIndex(a.t)-tIndex(b.t))}).forEach(l=>{
      const s=pos[sc+':'+l.s], t=pos[tc+':'+l.t];
      const hh=Math.max(1.5,l.v*scale);
      const so=outOff[sc+':'+l.s]||0, to=inOff[tc+':'+l.t]||0;
      const sy0=s.y+so, sy1=sy0+hh, ty0=t.y+to, ty1=ty0+hh;
      outOff[sc+':'+l.s]=so+hh; inOff[tc+':'+l.t]=to+hh;
      const sx=s.x+NW, tx=t.x, mx=(sx+tx)/2;
      const d=`M${sx},${sy0} C${mx},${sy0} ${mx},${ty0} ${tx},${ty0} L${tx},${ty1} C${mx},${ty1} ${mx},${sy1} ${sx},${sy1} Z`;
      const mid=`M${sx},${(sy0+sy1)/2} C${mx},${(sy0+sy1)/2} ${mx},${(ty0+ty1)/2} ${tx},${(ty0+ty1)/2}`;
      linkPaths.push({d,mid,l,cls,color:colorFn(l),sc,tc});
    });
  }
  addLinks(links1,0,1,()=>COLORS.steel,'l1');
  addLinks(links2,1,2,l=>COLORS[l.o.color],'l2');
  const selKey = state.sel ? JSON.stringify(state.sel) : '';
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sơ đồ dòng chảy công việc 90 ngày">`;
  svg+=`<text x="${X[0]}" y="14" font-size="11" font-weight="600" fill="var(--muted)">NƠI PHÁT SINH · phòng của người giao</text>`;
  svg+=`<text x="${X[1]+NW/2}" y="14" text-anchor="middle" font-size="11" font-weight="600" fill="var(--muted)">NƠI XỬ LÝ · phòng của người nhận</text>`;
  svg+=`<text x="${X[2]+NW}" y="14" text-anchor="end" font-size="11" font-weight="600" fill="var(--muted)">KẾT QUẢ · 90 ngày</text>`;
  linkPaths.forEach((p,i)=>{
    const isSel = state.sel && ((state.sel.type==='link'&&state.sel.s===p.l.s&&state.sel.t===p.l.t&&state.sel.cls===p.cls) || (state.sel.type==='unit'&&(p.l.s===state.sel.id||p.l.t===state.sel.id)) || (state.sel.type==='outcome'&&p.l.t===state.sel.id));
    const dim = state.sel && state.sel.type!=='kpi' && !isSel;
    const op = p.cls==='l1'?0.32:(p.l.o.id==='PENDING'?0.75:p.l.o.id==='APPROVED'?0.45:0.5);
    svg+=`<path class="link ${dim?'dim':''}" data-i="${i}" d="${p.d}" fill="${p.color}" opacity="${isSel?Math.min(1,op+0.3):op}"/>`;
    if(state.motion && (p.cls==='l1' ? p.l.v>=7 : p.l.o.id==='PENDING' && p.l.v>=1)){
      const dur = p.cls==='l1'? (6 - Math.min(3,p.l.v/60)) : 4;
      svg+=`<circle r="2.2" fill="${p.cls==='l1'?'var(--steel)':'var(--warn)'}"><animateMotion dur="${dur}s" repeatCount="indefinite" path="${p.mid}"/></circle>`;
    }
  });
  /* nodes */
  cols.forEach((c,ci)=>c.forEach(n=>{
    const p=pos[ci+':'+n.id];
    const u=UNITS[n.id];
    const sel = state.sel && ((state.sel.type==='unit'&&state.sel.id===n.id&&state.sel.col===ci)||(state.sel.type==='outcome'&&state.sel.id===n.id));
    let fill='var(--steel)';
    if(ci===2) fill=COLORS[n.o.color];
    if(u&&u.gap) fill='#9ca3af';
    svg+=`<g class="node ${sel?'sel':''}" data-col="${ci}" data-id="${n.id}">`;
    svg+=`<rect x="${p.x}" y="${p.y}" width="${NW}" height="${p.h}" fill="${fill}" opacity="${ci===2?0.9:0.85}"/>`;
    if(ci===1 && WAITING[n.id]){ /* vạch đỏ: đứng yên hôm nay */
      const w=WAITING[n.id]; const frac=Math.min(1,w[1]/Math.max(1,n.v)*6);
      svg+=`<rect x="${p.x-4}" y="${p.y}" width="3" height="${Math.max(3,p.h*frac)}" fill="var(--danger)"/>`;
    }
    const label = ci===2? n.o.name : (u?u.short:n.id);
    const ty = p.ly;
    const w=WAITING[n.id];
    const waitTs = (ci===1&&w)?` · <tspan fill="${w[1]?'var(--danger)':'var(--muted)'}" font-weight="600">${w[0]} đang chờ</tspan>`:'';
    if(p.small){
      const one = ci===0?`${label} <tspan class="n">· ${fmt(n.v)}</tspan>`: ci===1?`${label} <tspan class="n">· ${fmt(n.v)}${waitTs}</tspan>`:`${label} <tspan class="n">· ${fmt(n.v)}</tspan>`;
      svg+=`<text x="${ci===2?p.x-6:p.x+NW+6}" y="${ty}" ${ci===2?'text-anchor="end"':''}>${one}</text>`;
    } else if(ci===0){ svg+=`<text x="${p.x+NW+6}" y="${ty}">${label}</text><text class="n" x="${p.x+NW+6}" y="${ty+13}">${fmt(n.v)} lượt giao</text>`; }
    else if(ci===1){ svg+=`<text x="${p.x+NW+6}" y="${ty}">${label}</text><text class="n" x="${p.x+NW+6}" y="${ty+13}">${fmt(n.v)} nhận${waitTs}</text>`; }
    else { svg+=`<text x="${p.x-6}" y="${ty}" text-anchor="end">${label}</text><text class="n" x="${p.x-6}" y="${ty+13}" text-anchor="end">${fmt(n.v)}${n.o.med?` · trung vị ${String(n.o.med).replace('.',',')} giờ`:''}</text>`; }
    svg+='</g>';
  }));
  svg+='</svg>';
  const el=$('vizBody'); el.innerHTML=svg;
  el.querySelectorAll('.link').forEach(pth=>{
    const p=linkPaths[+pth.dataset.i];
    pth.onmousemove=e=>{
      const sName=UNITS[p.l.s]?UNITS[p.l.s].name:p.l.s; const tName=p.cls==='l1'?UNITS[p.l.t].name:p.l.o.name;
      showTip(e,`<b>${sName}</b> → <b>${tName}</b><br>${p.cls==='l1'?fmt(p.l.v)+' lượt giao / 90 ngày':Math.round(p.l.v)+' lượt (ước theo tỷ lệ)'}`)};
    pth.onmouseleave=hideTip;
    pth.onclick=()=>select({type:'link',s:p.l.s,t:p.l.t,cls:p.cls,v:p.l.v,o:p.l.o});
  });
  el.querySelectorAll('.node').forEach(g=>{
    g.onclick=()=>{const ci=+g.dataset.col,id=g.dataset.id; select(ci===2?{type:'outcome',id}:{type:'unit',id,col:ci})};
  });
  $('legend').innerHTML=`<span><i style="background:var(--steel)"></i>Đã duyệt</span><span><i style="background:var(--warn)"></i>Đang chờ</span><span><i style="background:var(--who)"></i>Trả lại</span><span><i style="background:var(--danger)"></i>Từ chối</span><span><i style="background:#9ca3af"></i>Bỏ qua / hủy</span><span><i style="background:var(--danger);width:3px"></i>vạch đỏ = đứng yên hôm nay</span>`;
  $('vizFoot').innerHTML=`<span>Độ rộng dải = số lượt giao bước xử lý trong 90 ngày (363 / 366 lượt, 20 cặp phòng lớn nhất).</span><span>Bấm phòng, dải hoặc kết quả để xem người và hồ sơ.</span><span class="wrn">Cột Kết quả theo từng phòng là chia tỷ lệ minh họa; tổng mỗi kết quả là số thật.</span>`;

/* ───────────────── Bản đồ phòng ban + công trường ───────────────── */
function mapSVG(){
  const W=880,H=540;
  const P={SMB:[92,120],TNB:[92,270],G3:[92,420],PM:[400,170],VT:[400,400],HR:[650,120],BLD:[800,270],UNK:[600,300],TC:[650,430],NM:[480,500]};
  const inTot={};FLOWS.forEach(([a,b,n])=>inTot[b]=(inTot[b]||0)+n);
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bản đồ phòng ban và công trường"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--steel)" opacity=".7"/></marker><marker id="arrw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--warn)"/></marker></defs>`;
  svg+=`<text x="92" y="40" text-anchor="middle" font-size="11" font-weight="600" fill="var(--muted)">CÔNG TRƯỜNG · đề xuất vật tư</text><text x="600" y="40" text-anchor="middle" font-size="11" font-weight="600" fill="var(--muted)">PHÒNG BAN · lượt giao bước xử lý 90 ngày</text>`;
  const r=id=>UNITS[id]?(UNITS[id].gap?24:10+Math.sqrt(UNITS[id].people)*4.2):22;
  function edge(a,b,n,color,marker,dash){
    const [x1,y1]=P[a],[x2,y2]=P[b];
    const w=Math.min(11,Math.max(1.2,Math.sqrt(n)*1.0));
    if(a===b){const rr=r(a);return `<g class="link" data-e="${a}|${b}"><path d="M${x1-7},${y1-rr+2} a 10 10 0 1 1 14,0" fill="none" stroke="${color}" stroke-width="${Math.min(5,w)}" opacity=".55" marker-end="url(#${marker})"/><text x="${x1+16}" y="${y1-rr-12}" font-size="10" fill="var(--muted)">${fmt(n)} nội bộ</text></g>`}
    const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;
    const sx=x1+ux*r(a),sy=y1+uy*r(a),tx=x2-ux*(r(b)+6),ty=y2-uy*(r(b)+6);
    const cx=(sx+tx)/2-uy*L*0.12,cy=(sy+ty)/2+ux*L*0.12;
    return `<path class="link" data-e="${a}|${b}" d="M${sx},${sy} Q${cx},${cy} ${tx},${ty}" fill="none" stroke="${color}" stroke-width="${w}" opacity=".5" ${dash?'stroke-dasharray="5 4"':''} marker-end="url(#${marker})"/>`;
  }
  const edges=[];
  FLOWS.forEach(([a,b,n])=>{ if(P[a]&&P[b]) edges.push({a,b,n,svg:edge(a,b,n,'var(--steel)','arr')}); });
  PROJECTS.forEach(p=>{ edges.push({a:p.id,b:'PM',n:p.pending,mr:true,svg:edge(p.id,'PM',p.pending*3,'var(--warn)','arrw',true)}); edges.push({a:p.id,b:'VT',n:p.approved+p.transit,mr:true,svg:edge(p.id,'VT',(p.approved+p.transit)*1.2,'var(--warn)','arrw',true)}); });
  edges.sort((a,b)=>b.n-a.n).forEach(e=>svg+=e.svg);
  /* công trường */
  PROJECTS.forEach(p=>{const [x,y]=P[p.id];const w=p.pending+p.approved+p.transit;
    svg+=`<g class="node" data-proj="${p.id}"><rect x="${x-70}" y="${y-26}" width="140" height="52" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="1.5"/>
    <text x="${x}" y="${y-8}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--fg)">${p.id==='SMB'?'Sơn Miền Bắc':p.id==='TNB'?'Thú nhồi bông GĐ2':'G3 BOQ'}</text>
    <text x="${x}" y="${y+8}" text-anchor="middle" font-size="11" fill="var(--warn)" font-weight="600">${w} đề xuất VT đang mở</text>
    <text x="${x}" y="${y+20}" text-anchor="middle" font-size="10" fill="var(--muted)">chờ cấp trung bình ${String(p.avgDays).replace('.',',')} ngày</text></g>`});
  /* phòng ban */
  Object.keys(UNITS).forEach(id=>{const [x,y]=P[id];const rr=r(id);const u=UNITS[id];const w=WAITING[id]||[0,0,0];const frac=w[0]?w[1]/w[0]:0;
    const circ=2*Math.PI*(rr+5);
    const sel=state.sel&&state.sel.type==='unit'&&state.sel.id===id;
    svg+=`<g class="node ${sel?'sel':''}" data-unit="${id}">
      <circle cx="${x}" cy="${y}" r="${rr}" fill="${u.gap?'#e5e7eb':'var(--steel-s)'}" stroke="${u.gap?'#9ca3af':'var(--steel)'}" stroke-width="${sel?2.5:1.5}" ${u.gap?'stroke-dasharray="4 3"':''}/>
      ${w[0]?`<circle cx="${x}" cy="${y}" r="${rr+5}" fill="none" stroke="var(--danger-soft)" stroke-width="4"/><circle cx="${x}" cy="${y}" r="${rr+5}" fill="none" stroke="var(--danger)" stroke-width="4" stroke-dasharray="${(circ*frac).toFixed(1)} ${circ.toFixed(1)}" transform="rotate(-90 ${x} ${y})"/>`:''}
      <text x="${x}" y="${y+4}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--steel)">${u.people}</text>
      <text x="${x}" y="${y+rr+22}" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--fg)">${u.short}</text>
      <text x="${x}" y="${y+rr+35}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${fmt(inTot[id]||0)} nhận · <tspan fill="${w[1]?'var(--danger)':'var(--muted)'}" font-weight="600">${w[0]} chờ</tspan></text>
      ${w[0]?`<g><circle cx="${x+rr-2}" cy="${y-rr+2}" r="10" fill="${w[1]?'var(--danger)':'var(--warn)'}"/><text x="${x+rr-2}" y="${y-rr+6}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">${w[0]}</text></g>`:''}
    </g>`});
  svg+='</svg>';
  const el=$('vizBody');el.innerHTML=svg;
  el.querySelectorAll('[data-unit]').forEach(g=>g.onclick=()=>select({type:'unit',id:g.dataset.unit,col:1}));
  el.querySelectorAll('[data-proj]').forEach(g=>g.onclick=()=>select({type:'project',id:g.dataset.proj}));
  el.querySelectorAll('.link').forEach(p=>{const [a,b]=p.dataset.e.split('|');const e=edges.find(x=>x.a===a&&x.b===b);
    p.onmousemove=ev=>showTip(ev,`<b>${UNITS[a]?UNITS[a].name:PROJECTS.find(x=>x.id===a).name}</b> → <b>${UNITS[b].name}</b><br>${e.mr?e.n+' đề xuất vật tư đang mở':fmt(e.n)+' lượt giao / 90 ngày'}`);
    p.onmouseleave=hideTip; p.onclick=()=>select(e.mr?{type:'project',id:a}:{type:'link',s:a,t:b,cls:'l1',v:e.n});});

/* ───────────────── Xếp hạng ───────────────── */
function rankHTML(){
  const byIn={};FLOWS.forEach(([a,b,n])=>byIn[b]=(byIn[b]||0)+n);
  const mostAssigned=APPROVERS.slice().sort((a,b)=>b[1]-a[1]).slice(0,6);
  const fastest=APPROVERS.filter(a=>a[1]>=10).sort((a,b)=>a[2]-b[2]).slice(0,5);
  const slowest=APPROVERS.filter(a=>a[1]>=10).sort((a,b)=>b[2]-a[2]).slice(0,5);
  const maxN=Math.max(...APPROVERS.map(a=>a[1]));
  const tbl=(rows,cols)=>`<table><thead><tr>${cols.map(c=>`<th class="${c.r?'r':''}">${c.l}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td class="${c.r?'r':''}">${c.f(r)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  const bar=(v,max,color)=>`<span class="tr" style="display:inline-block;width:70px;height:8px;background:var(--card2);border-radius:4px;vertical-align:middle;margin-right:6px"><i style="display:block;height:100%;width:${(v/max*100).toFixed(0)}%;background:${color};border-radius:4px"></i></span>`;
  const hrs=v=>String(v).replace('.',',')+' giờ';
  $('vizBody').innerHTML=`<div class="rank">
    <div><h4><span class="ico sky" style="width:20px;height:20px;border-radius:6px;display:inline-grid;place-items:center">↓</span>Nhận nhiều việc nhất · 90 ngày</h4>${tbl(mostAssigned,[{l:'Người',f:r=>`<span class="who">${r[0]}</span>`},{l:'Lượt xử lý',r:1,f:r=>bar(r[1],maxN,'var(--steel)')+`<span class="num">${r[1]}</span>`},{l:'Trung vị',r:1,f:r=>hrs(r[2])}])}</div>
    <div><h4><span class="ico mint" style="width:20px;height:20px;border-radius:6px;display:inline-grid;place-items:center">✓</span>Xử lý nhanh nhất · từ 10 lượt</h4>${tbl(fastest,[{l:'Người',f:r=>`<span class="who">${r[0]}</span>`},{l:'Lượt',r:1,f:r=>`<span class="num">${r[1]}</span>`},{l:'Trung vị',r:1,f:r=>`<span class="num">${hrs(r[2])}</span>`},{l:'Trung bình',r:1,f:r=>hrs(r[3])}])}</div>
    <div><h4><span class="ico rose" style="width:20px;height:20px;border-radius:6px;display:inline-grid;place-items:center">!</span>Xử lý chậm nhất · từ 10 lượt</h4>${tbl(slowest,[{l:'Người',f:r=>`<span class="who">${r[0]}</span>`},{l:'Lượt',r:1,f:r=>`<span class="num">${r[1]}</span>`},{l:'Trung vị',r:1,f:r=>`<span class="bad">${hrs(r[2])}</span>`},{l:'Đang giữ',r:1,f:r=>{const p=PENDING_PEOPLE.find(x=>x[0]===r[0]);return p?`<span class="bad">${p[1]}</span>`:'0'}}])}</div>
    <div><h4><span class="ico who" style="width:20px;height:20px;border-radius:6px;display:inline-grid;place-items:center">+</span>Tạo nhiều phiếu nhất · 90 ngày</h4>${tbl(CREATORS.slice(0,6),[{l:'Người',f:r=>`<span class="who">${r[0]}</span>`},{l:'Phòng',f:r=>UNITS[r[2]]?UNITS[r[2]].short:'—'},{l:'Phiếu',r:1,f:r=>bar(r[1],45,'var(--who)')+`<span class="num">${r[1]}</span>`}])}</div>
  </div>`;
  $('legend').innerHTML='';
  $('vizFoot').innerHTML=`<span>Trung vị = một nửa số lượt xử lý nhanh hơn con số này. Chỉ xếp hạng người có từ 10 lượt để tránh so sánh lệch.</span><span class="wrn">Một lượt duyệt 1 phút và một bước nhận hàng cả ngày đang được đếm như nhau — cần trọng số theo loại phiếu (câu hỏi 5).</span>`;
}

/* ───────────────── Ngăn phải ───────────────── */
function personRow(p){const u=p[3]&&UNITS[p[3]];const old=p[2];const oldDays=ageDays(old);
  return `<div class="row"><div class="t"><b><span class="who">${p[0]}</span>${u?` <span class="pill steel">${u.short}</span>`:''}</b><small><span class="${oldDays>30?'bad':oldDays>3?'wrn':''}">${p[1]} việc đang chờ</span> · cũ nhất từ ${old}${oldDays>30?` <span class="bad stuck">· ${oldDays} ngày</span>`:''}</small></div><div class="acts"><button class="mini" title="Gửi nhắc qua thông báo + Zalo">Nhắc</button><button class="mini p" title="Mở danh sách việc của người này thành tab">Xem</button></div></div>`}
function ageDays(dm){const [d,m]=dm.split('/').map(Number);const dt=new Date(2026,m-1,d);return Math.round((new Date(2026,9,13)-dt)/86400000)}
function bars(items,max){return items.map(([l,v,c])=>`<div class="bar"><span>${l}</span><span class="tr"><i style="width:${(v/max*100).toFixed(0)}%;background:${COLORS[c]||'var(--steel)'}"></i></span><span class="r num">${v}</span></div>`).join('')}
function overviewPanel(){
  return `<h2>Điểm nghẽn hôm nay <span class="pill rose">${totalStuck} đứng yên</span></h2><div class="sub">Việc đang nằm ở ai, bao lâu, và nguồn nào chưa nối.</div>
  <h3>Ùn ở người</h3>${PENDING_PEOPLE.slice(0,5).map(personRow).join('')}<button class="mini" style="margin:4px 0 0 8px">Xem cả 10 người</button>
  <h3>Tuổi của ${totalWaiting} việc đang chờ</h3>${bars(AGE,21)}
  <h3>Theo loại phiếu</h3>${bars(TEMPLATES.map(t=>[t[0].length>30?t[0].slice(0,28)+'…':t[0],t[1],'amber']),30).replace(/<span>([^<]+)<\/span>/g,(m,s)=>`<span title="${s}">${s}</span>`)}
  <h3>Thông tin gửi đi mà chưa được đọc</h3>
  <div class="stat3"><div><b class="bad">${fmt(NOTIF.unread7d)}</b><small>thông báo quá 7 ngày</small></div><div><b>${NOTIF.people7d}</b><small>người chưa đọc</small></div><div><b>${Math.round(NOTIF.unread/NOTIF.total30*100)}%</b><small>chưa đọc / 30 ngày</small></div></div>
  <div class="note">Bản xem thử v0: sơ đồ chạy trên 366 lượt giao của Quy trình & Đề xuất. Đợt 1 nối thêm 18 nguồn (đơn hàng, phiếu kho, nhật ký, đề nghị chi, nghỉ phép, văn bản…) đã có trong RPC Việc của tôi.</div>`;
}
function unitPanel(id){
  const u=UNITS[id];const w=WAITING[id]||[0,0,0];
  const out=FLOWS.filter(f=>f[0]===id),inn=FLOWS.filter(f=>f[1]===id);
  const sum=a=>a.reduce((x,f)=>x+f[2],0);
  const partners=[...new Set([...out,...inn].map(f=>f[0]===id?f[1]:f[0]))].filter(x=>x!==id).map(p=>[p, sum(out.filter(f=>f[1]===p)), sum(inn.filter(f=>f[0]===p))]).sort((a,b)=>b[1]+b[2]-a[1]-a[2]);
  const people=PENDING_PEOPLE.filter(p=>p[3]===id);
  return `<button class="back" onclick="select(null)">‹ Điểm nghẽn hôm nay</button>
  <h2><span class="ent">${u.name}</span></h2><div class="sub">${u.people} người${u.gap?' · <span class="bad">chưa có phòng ban trong HRM</span>':''}</div>
  <div class="stat3"><div><b class="${w[0]?'wrn':''}">${w[0]}</b><small>đang chờ</small></div><div><b class="${w[1]?'bad':''}">${w[1]}</b><small>đứng yên &gt;3 ngày</small></div><div><b class="${w[2]?'bad':''}">${w[2]}</b><small>quá hạn SLA</small></div></div>
  <div class="stat3"><div><b>${fmt(sum(inn))}</b><small>nhận / 90 ngày</small></div><div><b>${fmt(sum(out))}</b><small>giao đi / 90 ngày</small></div><div><b>${fmt(sum(inn.filter(f=>f[0]===id)))}</b><small>nội bộ phòng</small></div></div>
  <h3>Trao đổi với phòng khác</h3>${partners.slice(0,5).map(([p,o,i])=>`<div class="bar"><span title="${UNITS[p].name}">${UNITS[p].short}</span><span class="tr" style="display:flex;gap:1px;background:none"><i style="width:${(i/180*100).toFixed(0)}%;background:var(--steel)" title="nhận từ ${UNITS[p].short}: ${i}"></i><i style="width:${(o/180*100).toFixed(0)}%;background:var(--accent);opacity:.6" title="giao cho ${UNITS[p].short}: ${o}"></i></span><span class="r num">${i}↓ ${o}↑</span></div>`).join('')||'<div class="sub">Chỉ xử lý nội bộ.</div>'}
  <h3>Người đang giữ việc</h3>${people.length?people.map(personRow).join(''):`<div class="sub">Bản xem thử chưa gắn người của phòng này (đợt 1 lấy từ cùng truy vấn).</div>`}
  <div style="display:flex;gap:6px;margin-top:12px"><button class="mini p" style="flex:1;height:30px">Mở ${w[0]} việc đang chờ</button><button class="mini" style="height:30px" title="Nhắc trưởng phòng và người đang giữ việc">Nhắc cả phòng</button></div>`;
}
function linkPanel(s){
  const sName=UNITS[s.s]?UNITS[s.s].name:s.s; const tName=s.cls==='l1'?UNITS[s.t].name:s.o.name;
  return `<button class="back" onclick="select(null)">‹ Điểm nghẽn hôm nay</button><h2><span class="ent">${sName}</span> → <span class="ent">${tName}</span></h2>

  <div class="stat3"><div><b>${s.cls==='l1'?fmt(s.v):Math.round(s.v)}</b><small>lượt</small></div><div><b>—</b><small>trung vị xử lý<br><span style="font-size:10px">(đợt 1)</span></small></div><div><b>—</b><small>% đúng hạn<br><span style="font-size:10px">(đợt 1)</span></small></div></div>
  <h3>Loại phiếu chạy trên dải này</h3>${bars(TEMPLATES.map(t=>[t[0].length>30?t[0].slice(0,28)+'…':t[0],t[1],'steel']),30)}

}
function outcomePanel(id){const o=OUTCOMES.find(x=>x.id===id);
  let extra='';
  if(id==='PENDING') extra=`<h3>Tuổi việc</h3>${bars(AGE,21)}<h3>Ùn ở người</h3>${PENDING_PEOPLE.slice(0,5).map(personRow).join('')}`;
  if(id==='RETURNED') extra=`<div class="stat3"><div><b>11</b><small>phiếu bị trả</small></div><div><b class="bad">1</b><small>phiếu trả 2 lần</small></div><div><b>16,6 giờ</b><small>trung bình tới lúc trả</small></div></div><div class="note">Trả lại nhiều ở một mẫu phiếu = form thiếu trường bắt buộc hoặc người lập chưa được hướng dẫn. Đợt 2 thống kê lý do trả.</div>`;
  if(id==='APPROVED') extra=`<div class="stat3"><div><b>19,5 giờ</b><small>trung vị</small></div><div><b>56,5 giờ</b><small>trung bình</small></div><div><b>72%</b><small>có SLA</small></div></div><div class="note">Trung bình cao hơn trung vị gần 3 lần: phần lớn duyệt trong ngày, một số ít kéo rất dài làm xấu bình quân. Đợt 1 hiện phân phối thời gian theo loại phiếu.</div>`;
  if(id==='SKIPPED'||id==='CANCELLED') extra=`<div class="note">${id==='SKIPPED'?'Bỏ qua bước thường do người duyệt vắng và hệ thống tự chuyển; nhiều lần ở cùng một bước = bước thừa trong quy trình.':'Phiếu bị hủy sau khi đã giao = công sức mất; hiện số này theo mẫu phiếu để chỉnh quy trình.'}</div>`;

function projectPanel(id){const p=PROJECTS.find(x=>x.id===id);
  return `<button class="back" onclick="select(null)">‹ Điểm nghẽn hôm nay</button><h2><span class="ent">${p.name}</span></h2><div class="sub">Đề xuất vật tư từ công trường đang mở</div>

  <div class="bar"><span>Chờ cấp TB</span><span class="tr"><i style="width:${Math.min(100,p.avgDays/60*100).toFixed(0)}%;background:${p.avgDays>30?'var(--danger)':'var(--warn)'}"></i></span><span class="r num">${String(p.avgDays).replace('.',',')} ng</span></div>
  <div class="note">Đề xuất đã duyệt mà chưa cấp là điểm nghẽn ở Vật tư / Mua hàng, không phải ở người duyệt. Đợt 1 nối đơn hàng và phiếu kho để thấy dòng này chạy tiếp đến đâu.</div>
  <div style="display:flex;gap:6px;margin-top:12px"><button class="mini p" style="flex:1;height:30px">Mở ${p.pending+p.approved+p.transit} đề xuất</button><button class="mini" style="height:30px">Xem Mua hàng</button></div>`;

function kpiPanel(id){
  const map={
    waiting:()=>`<h2>${fmt(totalWaiting)} việc đang chờ</h2><div class="sub">Theo phòng của người đang giữ việc</div>${bars(Object.entries(WAITING).sort((a,b)=>b[1][0]-a[1][0]).map(([u,w])=>[UNITS[u].short,w[0],w[1]?'rose':'amber']),13)}<h3>Ùn ở người</h3>${PENDING_PEOPLE.slice(0,6).map(personRow).join('')}`,
    stuck:()=>`<h2>${totalStuck} việc đứng yên &gt; 3 ngày</h2><div class="sub">Ngưỡng 3 ngày làm việc; đổi được ở Thiết lập.</div>${bars(AGE.slice(2),21)}<h3>Ùn ở người</h3>${PENDING_PEOPLE.filter(p=>ageDays(p[2])>3).map(personRow).join('')}<div class="note">21 việc chờ từ tháng 6–9 nhiều khả năng là phiếu "chết" (người duyệt đổi vị trí, phiếu không còn cần). Cần nút <b>Dọn việc cũ</b>: hủy hoặc chuyển người, có lý do, có nhật ký.</div>`,

$('motionBtn').onclick=()=>{state.motion=!state.motion;$('motionBtn').textContent=(state.motion?'■ Dừng':'▶ Chuyển động');renderViz()};
$('themeBtn').onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'':'dark'};
$('unitSel').onchange=e=>{const id=Object.keys(UNITS).find(k=>UNITS[k].name===e.target.value);select(id?{type:'unit',id,col:1}:null)};
$('projSel').onchange=e=>{const p=PROJECTS.find(x=>x.name===e.target.value||(x.id==='TNB'&&e.target.value.startsWith('NHÀ MÁY')));select(p?{type:'project',id:p.id}:null)};
if(location.search.includes('dark')) document.documentElement.dataset.theme='dark';
if(location.search.includes('view=map')) {state.view='map';$('viewSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v==='map'));renderViz()}
if(location.search.includes('view=rank')) {state.view='rank';$('viewSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v==='rank'));renderViz()}
if(location.search.includes('sel=VT')) select({type:'unit',id:'VT',col:1});
</script>
</body>
</html>
