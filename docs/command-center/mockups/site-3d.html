<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Công trường Sơn Miền Bắc 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f5;--card:#fff;--border:#e5e5e5;--fg:#1a1a1a;--fg2:#444;--muted:#737373;--accent:#1f8a70;--warn:#b45309;--danger:#b42318;--plan:#cbd5e1;--doc:#f5d27a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:13px;overflow:hidden}
#stage{position:fixed;inset:0}#stage canvas{display:block}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--border);background:var(--card);border-radius:8px;height:28px;padding:0 10px;font-weight:600;font-size:12px}
button:hover{background:#f2f2f2}button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);background:#e8f3ee}
.card{position:fixed;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.08);z-index:5}
.left{left:16px;top:16px;width:340px;max-height:calc(100vh - 128px);overflow:auto;padding:14px 14px 10px}
.left h1{font-size:15px;margin:0}.left .sub{color:var(--muted);font-size:12px;margin:2px 0 10px}
.total{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}.total b{font-size:26px;font-variant-numeric:tabular-nums}.total span{color:var(--muted);font-size:12px}
.bar{position:relative;height:8px;border-radius:999px;background:#eef0f2;overflow:hidden}
.bar .plan{position:absolute;left:0;top:0;bottom:0;background:var(--plan)}.bar .act{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:999px}
.bar.late .act{background:#d97706}
.tree{margin-top:10px;display:grid;gap:2px}
.node{border-radius:9px}
.node>.head{display:grid;grid-template-columns:16px 1fr 46px;gap:6px;align-items:center;padding:6px 6px;border-radius:9px;cursor:pointer;width:100%;border:0;background:none;height:auto;text-align:left;font-weight:600}
.node>.head:hover{background:#f6f7f8}.node>.head[aria-current=true]{background:#e8f3ee}
.node .pct{text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.node .nm{display:block;font-size:12.5px;line-height:1.25}.node .bar{margin-top:4px;height:6px}
.node .tw{color:var(--muted);font-size:10px;transition:transform .15s}.node[data-open=true]>.head .tw{transform:rotate(90deg)}
.kids{padding-left:14px;display:none}.node[data-open=true]>.kids{display:block}
.task{display:grid;grid-template-columns:1fr 40px;gap:6px;padding:4px 6px;border-radius:8px;font-size:11.5px;cursor:pointer;width:100%;border:0;background:none;height:auto;text-align:left;font-weight:500}
.task:hover{background:#f6f7f8}.task[aria-current=true]{background:#fff4d6}
.task .pct{text-align:right;font-variant-numeric:tabular-nums}.task .late{color:var(--danger);font-weight:600}
.task small{display:block;color:var(--muted);font-size:10.5px}
.right{right:16px;top:16px;width:320px;max-height:calc(100vh - 128px);overflow:auto;padding:14px 16px}
.right h2{font-size:14px;margin:0 0 2px;color:var(--accent)}.right .sub{color:var(--muted);font-size:12px;margin:0 0 8px}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #f0f0f0;font-size:12.5px}
.row:last-child{border:0}.row b{font-variant-numeric:tabular-nums;text-align:right}.row span{color:var(--fg2)}
.sec{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:12px 0 4px}
.ok{color:var(--accent);font-weight:600}.wrn{color:var(--warn);font-weight:600}.bad{color:var(--danger);font-weight:600}
.pill{display:inline-block;font-size:10.5px;font-weight:600;border-radius:6px;padding:0 6px;background:#f1f2f3;color:#555}
.timeline{left:372px;right:352px;bottom:16px;padding:10px 14px;display:grid;grid-template-columns:auto auto 1fr auto;gap:12px;align-items:center}
.timeline .date{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;min-width:118px}
.timeline input[type=range]{width:100%;accent-color:var(--accent)}
.ticks{position:relative;height:12px;margin-top:-2px;font-size:10px;color:var(--muted)}.ticks span{position:absolute;transform:translateX(-50%)}
.views{left:372px;top:16px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100vw - 740px)}
.label{font-size:11.5px;font-weight:600;color:var(--fg);background:rgba(255,255,255,.93);border:1px solid var(--border);border-radius:8px;padding:3px 7px;white-space:nowrap;pointer-events:none;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.label small{display:block;font-weight:500;color:var(--muted);font-size:10.5px}
.label.click{pointer-events:auto;cursor:pointer}.label.click:hover{border-color:var(--accent)}
.label.bld{font-size:12.5px;font-weight:800;color:#1f8a70}.label.team{color:#9a3412;border-color:#fdba74;font-size:10.5px;padding:2px 6px}
.label.mach{color:#1d4290;font-size:10.5px;padding:2px 6px}.label.pour{background:#1f2937;color:#fff;border-color:#1f2937;font-size:10.5px}
.legend{display:grid;gap:3px;font-size:11px;color:var(--fg2);margin-top:10px;border-top:1px solid #f0f0f0;padding-top:8px}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:6px 12px;border-radius:999px;font-size:12px;z-index:6;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media(max-width:1100px){.views{left:16px;top:auto;bottom:96px;max-width:calc(100vw - 32px)}.timeline{left:16px;right:16px}.left{max-height:38vh;width:min(92vw,340px)}.right{top:auto;bottom:160px;max-height:30vh;width:min(92vw,320px)}}
</style>
</head>

</aside>

<div class="card views" id="views">
  <span id="viewBtns" style="display:contents"></span>
  <button id="btnGhost" aria-pressed="true">Hình hoàn thành</button>

</div>

<aside class="card right" id="info"></aside>

<div class="card timeline">

  <button id="btnToday">Hôm nay</button>
</div>
<div class="toast" id="toast"></div>

info.addEventListener('click', e => { const tk = e.target.closest('[data-task]'); if (tk) selectTask(tk.dataset.task); const bk = e.target.closest('[data-back]'); if (bk) { selTask = null; selBld = null; clearHL(); showDay(); } });
const CENTER = SITE_KEY === 'DA29' ? { NVP: [34, 4, -128, 70], NNC: [-14, 5, 18, 45], NX: [43, 4, -37, 180], COC: [43, 4, -37, 180], PHU: [0, 0, -60, 200], HT: [5, 0, -50, 230] } : { NVP: [-28, 6, 16, 55], NX1: [15, 6, -17, 80], NX2: [-25, 6, -27, 80], NX3: [-5, 6, -118, 120], HT: [0, 0, -50, 230] };
function selectBuilding(key, fly = true) {
  selBld = key; const b = BLD[key], ts = b.roots.map(r => TASK[r]);
  info.innerHTML = `<button type="button" data-back style="border:0;background:none;padding:0;height:auto;color:#737373;font-weight:500">← Ngày đang xem</button><h2>${b.name}</h2><p class="sub">${dd(DAY)} · thực tế so với kế hoạch</p>
    ${ts.map(t => { const a = groupAt(t, DAY), p = groupPlan(t, DAY); return `<div class="row"><span>${esc(t.name.replace(/^.*?-\s*/, ''))}</span><b class="${a + 5 < p ? 'bad' : 'ok'}">${pct(a)} <small style="color:#737373;font-weight:500">/ KH ${pct(p)}</small></b></div>`; }).join('')}
    ${(ANOMALIES[key] || []).length ? `<div class="sec" style="color:#b42318">Cần kiểm tra số liệu</div>${ANOMALIES[key].map(n => `<p class="sub" style="margin:2px 0 6px">${esc(n)}</p>`).join('')}` : ''}
    <div class="sec">Đầu việc đang dở</div>${ts.flatMap(leaves).filter(t => { const v = pAt(t.wbs, DAY); return v > 0 && v < 100; }).map(t => `<button type="button" class="task" data-task="${t.wbs}"><span>${esc(t.wbs)} · ${esc(t.name)}</span><span class="pct">${pct(pAt(t.wbs, DAY))}</span></button>`).join('') || '<p class="sub">Không có.</p>'}`;
  if (fly) { const [x, y, z, r] = CENTER[key]; flyTo(v3(x, y, z), r); }
}
let hlUntil = 0, hlList = [];
function clearHL() { for (const e of hlList) e.mesh.material = e.base; hlList = []; treeEl.querySelectorAll('[aria-current]').forEach(x => x.removeAttribute('aria-current')); }
function selectTask(wbs) {
  clearHL(); selTask = wbs; const t = TASK[wbs]; hlList = ELEMS.filter(e => e.task === wbs && e.to > e.from); hlUntil = performance.now() + 3200;
  treeEl.querySelectorAll(`[data-task="${CSS.escape(wbs)}"]`).forEach(x => { x.setAttribute('aria-current', 'true'); x.closest('.node[data-grp]').dataset.open = 'true'; x.closest('.node[data-bld]').dataset.open = 'true'; });
  const v = pAt(wbs, DAY), pv = planAt(t, DAY), series = DATA.series[wbs] || [];
  info.innerHTML = `<button type="button" data-back style="border:0;background:none;padding:0;height:auto;color:#737373;font-weight:500">← Ngày đang xem</button><h2>${esc(wbs)} · ${esc(t.name)}</h2><p class="sub">${esc(TASK[t.parent]?.name || '')}</p>
    <div class="row"><span>Thực tế ${dd(DAY)}</span><b class="${v + 5 < pv ? 'bad' : 'ok'}">${pct(v)}</b></div><div class="row"><span>Kế hoạch tới ${dd(DAY)}</span><b>${pct(pv)}</b></div>
    <div class="row"><span>Kế hoạch</span><b>${t.ps != null ? dd(t.ps) : '—'} → ${t.pe != null ? dd(t.pe) : '—'}</b></div>
    <div class="row"><span>Thực tế</span><b>${t.as != null ? dd(Math.min(t.as, t.ae ?? t.as)) : '—'} → ${t.ae != null && t.progress >= 100 ? dd(Math.max(t.as ?? t.ae, t.ae)) : 'đang làm'}</b></div>
    ${t.qty ? `<div class="row"><span>Khối lượng BOQ</span><b>${t.qty.toLocaleString('vi-VN')} ${esc(t.unit || '')}</b></div>` : ''}
    <div class="row"><span>Phần tử 3D</span><b>${hlList.length ? `${hlList.reduce((s, e) => s + (e.to - e.from), 0)} đang hiện` : (v > 0 ? 'khuất hoặc chưa dựng hình' : 'chưa làm')}</b></div>
    ${series.length > 1 ? `<div class="sec">% theo ngày ghi nhận</div>${series.slice(-8).map(([d2, p2]) => `<div class="row"><span>${dd(d2)}</span><b>${pct(p2)}</b></div>`).join('')}` : ''}`;
  const e0 = hlList[0]; if (e0) { const box = new THREE.Box3(); for (const e of hlList) for (let i = e.from; i < e.to; i += 1) { tmpP.setFromMatrixPosition(e.mats[i]); box.expandByPoint(tmpP); } const c = box.getCenter(v3(0, 0, 0)); flyTo(c, Math.max(30, box.getSize(v3(0, 0, 0)).length() * 1.3)); }
}

/* ───────── Camera, chọn trong cảnh, thời gian ───────── */
const VIEWS = SITE_KEY === 'DA29' ? { overview: [[-10, 215, 185], [8, 0, -50]], NNC: [[6, 17, 50], [-14, 3, 18]], NVP: [[62, 30, -82], [34, 3, -128]], NX: [[135, 80, 40], [43, 3, -37]], NX_PD2: [[95, 30, 5], [43, 1, -37]], yard: [[-26, 22, 82], [-34, 1, 40]] } : { overview: [[-150, 120, 140], [-5, 0, -55]], NVP: [[-62, 22, 62], [-28, 6, 16]], NX1: [[62, 30, 40], [15, 5, -17]], NX2: [[-82, 30, 20], [-25, 5, -27]], NX3: [[-110, 55, -40], [-5, 5, -118]], yard: [[40, 18, 58], [18, 1, 28]] };
let camFrom = null, camTo = null, camT = 1;
function flyTo(target, dist) { const dir = camera.position.clone().sub(controls.target).normalize(); camFrom = { p: camera.position.clone(), t: controls.target.clone() }; camTo = { p: target.clone().add(dir.multiplyScalar(dist)), t: target.clone() }; camT = 0; }
function goView(v) { const [p, t] = VIEWS[v]; camFrom = { p: camera.position.clone(), t: controls.target.clone() }; camTo = { p: v3(...p), t: v3(...t) }; camT = 0; document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v))); }
document.getElementById('viewBtns').innerHTML = (SITE_KEY === 'DA29' ? [['overview', 'Toàn cảnh'], ['NNC', 'Nhà nghỉ ca'], ['NVP', 'Nhà văn phòng'], ['NX', 'Nhà xưởng'], ['NX_PD2', 'Móng PĐ2'], ['yard', 'Bãi vật tư']] : [['overview', 'Toàn cảnh'], ['NVP', 'Nhà văn phòng'], ['NX1', 'Nhà xưởng 1'], ['NX2', 'Nhà xưởng 2'], ['NX3', 'Nhà xưởng 3'], ['yard', 'Bãi vật tư']])
  .map(([v, t2], i) => `<button data-view="${v}" aria-pressed="${i === 0}">${t2}</button>`).join('');
document.getElementById('siteTitle').textContent = CFG.title; document.getElementById('siteSub').textContent = `${CFG.code} · dựng 3D theo tiến độ từng hạng mục trong Vioo`; document.title = `${CFG.title} 3D`;
document.querySelectorAll('[data-site]').forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.site === SITE_KEY)); b.onclick = () => { if (b.dataset.site !== SITE_KEY) location.search = `?site=${b.dataset.site}`; }; });
camera.position.set(...VIEWS.overview[0]); controls.target.set(...VIEWS.overview[1]);
document.querySelectorAll('[data-view]').forEach(b => { b.onclick = () => goView(b.dataset.view); });
const btnRotate = document.getElementById('btnRotate'); btnRotate.onclick = () => { controls.autoRotate = !controls.autoRotate; btnRotate.setAttribute('aria-pressed', String(controls.autoRotate)); };
controls.addEventListener('start', () => { camT = 1; controls.autoRotate = false; btnRotate.setAttribute('aria-pressed', 'false'); });
const btnGhost = document.getElementById('btnGhost'); btnGhost.onclick = () => { ghosts.visible = !ghosts.visible; btnGhost.setAttribute('aria-pressed', String(ghosts.visible)); };
const ray = new THREE.Raycaster(), down = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', e => down.set(e.clientX, e.clientY));
renderer.domElement.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) return;
  ray.setFromCamera(new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
  for (const h of ray.intersectObjects(scene.children, true)) {
    if (!h.object.visible || ghosts.children.includes(h.object)) continue;
    const u = h.object.userData;
    if (u.elems) { selectTask(u.elems.task); return; }
    if (u.stock) { const { title, rows } = u.stock; info.innerHTML = `<button type="button" data-back style="border:0;background:none;padding:0;height:auto;color:#737373;font-weight:500">← Ngày đang xem</button><h2>${esc(title)}</h2><p class="sub">Tồn theo sổ ${CFG.warehouse} trong Vioo (14/10)</p>${rows.length ? rows.map(([n, un, q]) => `<div class="row"><span>${esc(n)}</span><b>${Number(q).toLocaleString('vi-VN')} ${esc(un || '')}</b></div>`).join('') : '<p class="sub">Không có dòng tồn.</p>'}${SITE_KEY === 'SMB' ? '<p class="sub" style="margin-top:8px">Sổ kho còn ghi cả vật tư đã dùng hết (ví dụ bê tông 1.272 m³) — cần đối soát xuất dùng.</p>' : ''}`; return; }
    if (u.machine) { const near = machinesNear(DAY); info.innerHTML = `<button type="button" data-back style="border:0;background:none;padding:0;height:auto;color:#737373;font-weight:500">← Ngày đang xem</button><h2>${MACH_NAME[u.machine]}</h2><p class="sub">${esc(near.get(u.machine) || '')}</p><p class="sub">Có trong nhật ký công trường 7 ngày tới ${dd(DAY)}. Vị trí trên mô hình là minh họa theo việc đang làm.</p>`; return; }
    if (u.site) return;
  }
});
const slider = document.getElementById('slider'), dateText = document.getElementById('dateText'), btnPlay = document.getElementById('btnPlay');
slider.max = String(TODAY); slider.value = String(TODAY);
document.getElementById('ticks').innerHTML = [0, 30, 61, 91, 122, 153, 183].map(d => `<span style="left:${(d / TODAY) * 100}%">${dd(d)}</span>`).join('');
let playing = false, playAcc = 0;
function setDay(d) {
  DAY = Math.max(0, Math.min(TODAY, d)); slider.value = String(DAY); dateText.textContent = `${wd(DAY)} ${dd(DAY)}/2026${DAY === TODAY ? ' · hôm nay' : ''}`;
  for (const u of UPDATERS) u(DAY);
  updateCrew(DAY); updateMachines(DAY); refreshTree();
  if (selTask) { const keep = selTask; selectTask(keep); } else if (selBld) selectBuilding(selBld, false); else showDay();
}
slider.addEventListener('input', () => { playing = false; btnPlay.textContent = '▶ Phát'; setDay(Number(slider.value)); });
btnPlay.onclick = () => { playing = !playing; if (playing && DAY >= TODAY) setDay(0); btnPlay.textContent = playing ? '⏸ Dừng' : '▶ Phát'; };
document.getElementById('btnToday').onclick = () => { playing = false; btnPlay.textContent = '▶ Phát'; setDay(TODAY); };
let toastT = null; function toast(text) { const el = document.getElementById('toast'); el.textContent = text; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2200); }
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); labels.setSize(innerWidth, innerHeight); });
window.siteDebug = { setDay, view: v => { goView(v); camT = 1; camera.position.copy(camTo.p); controls.target.copy(camTo.t); controls.update(); }, selectTask, selectBuilding, day: () => DAY };

const lodV = new THREE.Vector3();
function lod() { const far = camera.position.distanceTo(controls.target) > 170;
  for (const l of [...teamLabels, ...Object.values(machLabels), pourLabel]) { l.getWorldPosition(lodV); l.visible = far || lodV.distanceTo(controls.target) < 70; } }
window.siteDebug.focus = (x, y, z, dist, ax = -1, ay = 0.6, az = 1) => { camT = 1; controls.target.set(x, y, z); camera.position.set(x + ax * dist, y + ay * dist, z + az * dist); controls.update(); };
buildTree(); setDay(TODAY);
const clock = new THREE.Clock(); let t = 0, frame = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05); t += dt; frame += 1;
  if (playing) { playAcc += dt; if (playAcc > 0.3) { playAcc = 0; if (DAY >= TODAY) { playing = false; btnPlay.textContent = '▶ Phát'; } else setDay(DAY + 1); } }
  for (const g of [...Object.values(machines), pour.pump, ...pour.mixers]) if (g.visible && g.userData.anim) g.userData.anim(t);
  if (machines.crane?.userData.hook) machines.crane.userData.hook.visible = machines.crane.visible;
  for (const [k2, [ax, base, amp, sp]] of Object.entries(MACH_MOVE)) if (machines[k2]) machines[k2].position[ax] = base + Math.sin(t * sp) * amp;
  for (const w of crew.children) { w.position.y += Math.sin(t * 6 + w.userData.phase) * 0.0015; w.rotation.y += Math.sin(t * 0.8 + w.userData.phase) * 0.004; }
  if (hlList.length) { const on = performance.now() < hlUntil && Math.floor(performance.now() / 280) % 2 === 0; for (const e of hlList) e.mesh.material = on ? M.hl : e.base; if (performance.now() >= hlUntil) { for (const e of hlList) e.mesh.material = e.base; } }
  if (camT < 1) { camT = Math.min(1, camT + dt * 0.8); const e = camT < 0.5 ? 2 * camT * camT : -1 + (4 - 2 * camT) * camT; camera.position.lerpVectors(camFrom.p, camTo.p, e); controls.target.lerpVectors(camFrom.t, camTo.t, e); }
  if (frame % 8 === 0) lod();
  controls.update(); renderer.render(scene, camera); labels.render(scene, camera);
}
animate();
</script>
