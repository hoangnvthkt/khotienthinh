
[functions.request-print-docx-url]
enabled = true
verify_jwt = true
import_map = "./functions/request-print-docx-url/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/request-print-docx-url/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/request-print-docx-url/*.html" ]

[functions.process-request-notifications]
enabled = true
verify_jwt = true
import_map = "./functions/process-request-notifications/deno.json"
entrypoint = "./functions/process-request-notifications/index.ts"
